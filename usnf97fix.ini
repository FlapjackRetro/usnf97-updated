; usnf97fix settings. Delete a line to get its default.
[usnf97fix]

; 0 = window (default), 1 = borderless fullscreen. Alt+Enter switches while playing.
WindowMode=0
; Window size as a multiple of 640x480. 0 = largest that fits the screen.
WindowScale=0
; 0 = sharp pixels (nearest), 1 = smooth (halftone filtering).
Filter=0
; 1 = show the 320x200 mode at 4:3 the way a CRT did. 0 = square pixels.
AspectCorrect=1
; 1 = stretch to fill the window/screen (ignores aspect ratio).
Stretch=0
; 1 = pace screen updates to the display refresh (no wasted redraws).
VSync=1

; The game advances its clock by at least 5/256 s every frame, so above ~51 fps the
; whole simulation runs faster than real time. 1 = make each frame wait for real time.
FixGameSpeed=1
; Minimum frame step in 1/256 s. The game itself uses 5 (max ~51 fps). Leave at 5.
MinFrameTicks=5
; Extra frame cap in fps (0 = none). Can only lower the rate, e.g. 30.
FrameCap=0

; 1 = keep the mouse pointer inside the game picture while the game is the
; active window (the game asks for this). Alt+Tab or Alt+Enter to get out.
ConfineMouse=1

; 1 = the game pauses when its window loses focus (original behavior).
; In multiplayer the original game ENDS the session on focus loss; set 0 for net play.
PauseInBackground=1

; Folder holding USNF_10.LIB etc. Empty = the game folder if the files are there,
; otherwise the game looks for the CD as usual.
CDPath=

; 1 = write usnf97fix.log next to USNF.EXE.
Log=1

; ======================================================================
; Controllers. The game only understands one joystick (stick, throttle,
; rudder, one hat, 4 buttons) through the old Windows joystick API.
; usnf97fix feeds it from any DirectInput 8 game controller and XInput
; (Xbox-style) pads, combined however you like. Anything you leave
; unmapped stays on the keyboard, and any control can press game keys.
;
; In the game: Flight menu > Control > Stick = Joystick, Rudder = Rudder
; pedals, Throttle = Throttle stick, for each part you map here.
; ======================================================================
[input]
; 1 = DirectInput/XInput layer. 0 = the game reads Windows joysticks itself.
Enable=1

; Each role is "auto", "none" (keyboard), or one or more sources:
;   device:control        device = part of the controller's name ("Echo",
;                         "Pedals"), #1/#2... (Nth controller), pad / pad1..4
;   controls (DirectInput)  axes X Y Z RX RY RZ S1 S2, buttons B1..B128,
;                           hats POV1..POV4 (directions POV1U/R/D/L)
;   controls (Xbox pads)    axes LX LY RX RY LT RT, buttons A B X Y LB RB
;                           BACK START LS RS, d-pad DPAD (DPADU/R/D/L)
;   suffixes   ~ invert   RT-LT two axes as one (e.g. triggers as rudder)
;              >N / <N    axis past N percent acts as a button
; usnf97fix.log lists every controller with its axes and buttons, and the
; mapping that "auto" chose.
Roll=auto
Pitch=auto
; Throttle: the game wants the axis at its minimum for full power.
; If yours runs backwards, add ~ (e.g. Throttle=Echo:S1~).
Throttle=auto
Rudder=auto
Hat=auto
; The game's four joystick buttons. What they do depends on Flight >
; Control > Stick (for "Joystick": 1 = fire weapon, 3 = gun, 4 = next missile).
Button1=auto
Button2=auto
Button3=auto
Button4=auto

; Stick and rudder deadzone, percent.
Deadzone=3
; How often the game reads the joystick, ms. The game's own value is 50
; (from 1996 gameport hardware). Lower = less input lag, e.g. 10.
JoystickPollMs=50
; 1 = log every button/hat/axis change to usnf97fix.log, to find out
; what your controller calls each control.
LogInput=0
; 1 = controller buttons press game keys even when the game isn't focused.
KeysWhenUnfocused=0

[keys]
; <command or key>=<source>[, <source>...]   one binding per line.
; Commands: Gear Flaps Brakes Hook Autopilot Jammer DamageReport Target
;   WeaponPrev WeaponNext FireWeapon FireGun Chaff Flare Eject
;   ThrottleIdle Throttle25 Throttle50 Throttle75 ThrottleFull Afterburner
;   ThrottleDown ThrottleUp (repeat while held) StickForward StickBack
;   StickLeft StickRight RudderLeft RudderRight
;   ViewFront ViewBack ViewUp ViewTrack ViewMissile ViewWingman ViewTarget
;   ViewFromTarget ViewFlyBy ViewExternal ViewMissileCam Cockpit
;   Pause SlowMotion TargetInfo RadioSilence EndMission HudDim HudBright
;   WindowEnvelope WindowForward WindowOther WindowTarget WindowRWR
;   WindowNav WindowStatus WindowWeapons WindowRadar RadarRangeDown RadarRangeUp
; Or any key: g, E (= Shift+e), F1, Ctrl+p, Alt+s, PgDn, Num+ ...
; Examples:
;Gear=Echo:B9
;Flaps=Echo:B10
;Brakes=Echo:B5
;ThrottleUp=pad:RB
;ThrottleDown=pad:LB
;Afterburner=Echo:S1<5
